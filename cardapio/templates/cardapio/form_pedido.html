<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Pedido - Cardápio Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .main-content { flex: 1; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'home' %}">
                <i class="bi bi-journal-richtext text-warning"></i> Cardápio Digital
            </a>
        </div>
    </nav>

    <main class="container py-4 main-content">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h4 fw-bold text-dark mb-4"><i class="bi bi-cart-plus text-success me-2"></i>Fazer Novo Pedido</h2>

                        {% if erro %}
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ erro }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="mesa" class="form-label fw-semibold">Mesa</label>
                                <select name="mesa" id="mesa" class="form-select" required>
                                    <option value="">-- Selecione uma Mesa --</option>
                                    {% for mesa in mesas %}
                                        <option value="{{ mesa.id }}">Mesa {{ mesa.numero }} ({{ mesa.status }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="produto" class="form-label fw-semibold">Produto</label>
                                <select name="produto" id="produto" class="form-select" required>
                                    <option value="">-- Selecione um Produto --</option>
                                    {% for produto in produtos %}
                                        <option value="{{ produto.id }}">{{ produto.nome }} - R$ {{ produto.preco }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="quantidade" class="form-label fw-semibold">Quantidade</label>
                                <input type="number" name="quantidade" id="quantidade" class="form-control" value="1" min="1" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success fw-semibold">Confirmar Pedido</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            <p class="m-0">Projeto P1 - Laboratório de Programação Full Stack &copy; 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
